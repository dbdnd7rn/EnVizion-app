<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your EnVizion Life password</title>
  </head>
  <body style="margin:0;background:#f3edf5;font-family:Arial,Helvetica,sans-serif;color:#34263b">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3edf5;padding:28px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fffdfa;border-radius:24px;overflow:hidden;border:1px solid #eadfeb">
          <tr><td style="height:8px;background:#7b428e"></td></tr>
          <tr><td style="padding:38px 42px 18px;text-align:center">
            <div style="font-size:30px;font-weight:800;color:#34263b"><span style="color:#f51b2b">EnVizion</span> <span style="color:#7b428e">Life</span></div>
            <div style="margin-top:8px;font-size:12px;font-weight:700;letter-spacing:3px;color:#7b428e">ACCOUNT SECURITY</div>
          </td></tr>
          <tr><td style="padding:12px 42px 40px">
            <h1 style="margin:0 0 16px;font-size:28px;color:#34263b">Reset your password</h1>
            <p style="margin:0 0 26px;font-size:16px;line-height:1.65;color:#675b6c">Use the secure button below to choose a new EnVizion Life password. After updating it, return to the app and sign in again.</p>
            <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 auto 28px"><tr><td style="border-radius:14px;background:#7b428e"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 30px;color:#fff;text-decoration:none;font-size:16px;font-weight:700">Reset my password</a></td></tr></table>
            <div style="padding:18px;border-radius:14px;background:#f7f1f8;color:#675b6c;font-size:13px;line-height:1.55">If you did not request this change, ignore this email. Your password remains unchanged.</div>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>

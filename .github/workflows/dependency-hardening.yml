name: Dependency hardening gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and lock dependency graph
        run: npm install --no-audit

      - name: Require zero moderate-or-higher audit findings
        run: npm audit --audit-level=moderate

      - name: TypeScript gate
        run: npm run typecheck

      - name: Web export gate
        run: npm run build:web

      - name: Expo native prebuild gate
        env:
          CI: '1'
        run: npx expo prebuild --no-install --platform ios

      - name: Commit generated npm lockfile
        shell: bash
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock hardened npm dependency graph"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "package-lock.json already current"
          fi

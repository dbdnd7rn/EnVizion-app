name: Dependency audit diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve dependencies like Render
        run: npm install --package-lock-only --ignore-scripts

      - name: Print resolved vulnerable package versions
        shell: bash
        run: |
          npm install --ignore-scripts --no-audit
          npm ls @expo/cli @expo/config @expo/config-plugins @expo/metro @expo/metro-config @expo/prebuild-config expo-asset expo-constants image-size metro metro-config metro-transform-worker postcss uuid xcode --all || true
          echo "CONSTRAINTS_BEGIN"
          node <<'NODE'
          const { execSync } = require('child_process');
          const queries = [
            'expo@54.0.37',
            '@expo/metro@54',
            '@expo/metro-config@54',
            '@expo/config-plugins@54',
            'metro@0.83.8',
            'metro-config@0.83.8',
            'metro-transform-worker@0.83.8',
            'metro@0.83.9',
            'metro-config@0.83.9',
            'metro-transform-worker@0.83.9',
            'image-size',
            'postcss',
            'uuid',
            'xcode'
          ];
          for (const q of queries) {
            try {
              const result = execSync(`npm view "${q}" version dependencies --json`, { encoding: 'utf8' });
              console.log(q + '=' + result.trim());
            } catch (error) {
              console.log(q + '=UNAVAILABLE');
            }
          }
          NODE
          echo "CONSTRAINTS_END"

      - name: Print vulnerability summary
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const vulnerabilities = audit.vulnerabilities || {};
          const summary = Object.entries(vulnerabilities).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            range: v.range,
            fixAvailable: v.fixAvailable,
            via: Array.isArray(v.via)
              ? v.via.map(item => typeof item === 'string' ? item : {
                  source: item.source,
                  name: item.name,
                  dependency: item.dependency,
                  title: item.title,
                  url: item.url,
                  severity: item.severity,
                  range: item.range
                })
              : v.via,
            effects: v.effects,
            nodes: v.nodes
          }));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata));
          console.log('AUDIT_VULNERABILITIES_BEGIN');
          console.log(JSON.stringify(summary, null, 2));
          console.log('AUDIT_VULNERABILITIES_END');
          NODE

      - name: Check currently resolvable top-level updates
        shell: bash
        run: |
          npm outdated --json > outdated.json || true
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('outdated.json', 'utf8') || '{}');
          console.log('OUTDATED_BEGIN');
          console.log(JSON.stringify(data, null, 2));
          console.log('OUTDATED_END');
          NODE

name: Care Vault native gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit

      - name: Expo native prebuild
        env:
          CI: '1'
        run: npx expo prebuild --no-install --clean
